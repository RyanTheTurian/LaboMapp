<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Double Swipe</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;

            user-select:none;
            -webkit-user-select:none;
        }

        body{
            font-family:Arial,sans-serif;

            background:#f8f8f8;

            padding:20px;
        }

        .container{

            display:flex;

            gap:15px;

            width:100%;

            justify-content:center;

            flex-wrap:wrap;
        }

        .compare{

            position:relative;

            width:48%;

            height:70vh;

            overflow:hidden;

            border-radius:15px;

            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
        }

        /* IMMAGINE SOPRA */

        .after{

            position:absolute;

            top:0;
            left:0;

            width:50%;
            height:100%;

            overflow:hidden;
        }

        .after-image{

            width:100%;
            height:100%;

            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
        }

        /* SLIDER */

        .slider{

            position:absolute;

            top:0;
            left:50%;

            width:4px;
            height:100%;

            background:white;

            z-index:10;

            cursor:ew-resize;

            touch-action:none;
        }

        .slider::before{

            content:"↔";

            position:absolute;

            top:50%;
            left:50%;

            transform:translate(-50%,-50%);

            width:45px;
            height:45px;

            background:white;

            border-radius:50%;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:22px;
            font-weight:bold;

            color:black;

            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        /* MOBILE */

        @media (max-width:768px){

            .container{

                flex-direction:column;

                align-items:center;
            }

            .compare{

                width:100%;

                height:45vh;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <!-- BLOCCO 1 -->

    <div class="compare"
         style="background-image:url('images/before1.jpg')">

        <div class="after">

            <div class="after-image"
                 style="background-image:url('images/after1.jpg')">
            </div>

        </div>

        <div class="slider"></div>

    </div>

    <!-- BLOCCO 2 -->

    <div class="compare"
         style="background-image:url('images/before2.jpg')">

        <div class="after">

            <div class="after-image"
                 style="background-image:url('images/after2.jpg')">
            </div>

        </div>

        <div class="slider"></div>

    </div>

</div>

<script>

    document.querySelectorAll('.compare').forEach(compare => {

        const slider = compare.querySelector('.slider');
        const after = compare.querySelector('.after');

        let dragging = false;

        function moveSlider(clientX){

            const rect = compare.getBoundingClientRect();

            let x = clientX - rect.left;

            if(x < 0) x = 0;
            if(x > rect.width) x = rect.width;

            after.style.width = x + 'px';

            slider.style.left = x + 'px';
        }

        /* DESKTOP */

        slider.addEventListener('mousedown', () => {
            dragging = true;
        });

        window.addEventListener('mouseup', () => {
            dragging = false;
        });

        window.addEventListener('mousemove', e => {

            if(!dragging) return;

            moveSlider(e.clientX);
        });

        /* MOBILE */

        slider.addEventListener('touchstart', () => {
            dragging = true;
        });

        window.addEventListener('touchend', () => {
            dragging = false;
        });

        window.addEventListener('touchmove', e => {

            if(!dragging) return;

            moveSlider(e.touches[0].clientX);
        });

    });

</script>

</body>
</html>
