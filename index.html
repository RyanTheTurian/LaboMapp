<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Double Swipe</title>

    <style>

        /* RESET */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;

            user-select:none;
            -webkit-user-select:none;
        }

        /* PAGINA */

        html,body{

            width:100%;
            height:100%;
        }

        body{

            background:#f8f8f8;

            padding:20px;

            font-family:Arial,sans-serif;

            min-height:100vh;
        }

        /* CONTENITORE */

        .container{

            display:flex;

            gap:15px;

            width:100%;

            flex-wrap:wrap;

            justify-content:center;
        }

        /* BLOCCO SWIPE */

        .compare{

            position:relative;

            width:48%;

            aspect-ratio:16/9;

            overflow:hidden;

            border-radius:15px;

            background:white;
        }

        /* IMMAGINI */

        .compare img{

            position:absolute;

            inset:0;

            width:100%;
            height:100%;

            object-fit:cover;

            pointer-events:none;
            -webkit-user-drag::none;
        }

        /* FOTO SOPRA */

        .after{

            z-index:2;

            clip-path:inset(0 50% 0 0);
        }

        /* SLIDER */

        .slider{

            position:absolute;

            top:0;
            left:50%;

            transform:translateX(-50%);

            width:4px;
            height:100%;

            background:white;

            z-index:10;

            cursor:ew-resize;

            touch-action:none;
            user-select::none;
            -webkit-user-select:none;
        }

        /* CERCHIO */

        .slider::before{

            content:"↔";

            position:absolute;

            top:50%;
            left:50%;

            transform:translate(-50%,-50%);

            width:45px;
            height:45px;

            border-radius:50%;

            background:white;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:22px;
            font-weight:bold;

            color:black;

            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        /* MOBILE */

        @media (max-width:768px){

            body{

                padding:10px;
            }

            .container{

                flex-direction:column;

                align-items:center;

                gap:10px;
            }

            .compare{

                width:100%;

                aspect-ratio:16/7;
            }

            .slider::before{

                width:55px;
                height:55px;

                font-size:28px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <!-- SWIPE 1 -->

    <div class="compare">

        <!-- FOTO SOTTO -->

        <img src="images/before1.jpg">

        <!-- FOTO SOPRA -->

        <img class="after"
             src="images/after1.jpg">

        <!-- SLIDER -->

        <div class="slider"></div>

    </div>

    <!-- SWIPE 2 -->

    <div class="compare">

        <img src="images/before2.jpg">

        <img class="after"
             src="images/after2.jpg">

        <div class="slider"></div>

    </div>

</div>

<script>

    document.querySelectorAll('.compare').forEach(compare => {

        const slider = compare.querySelector('.slider');

        const after = compare.querySelector('.after');

        let dragging = false;

        /* FUNZIONE MOVIMENTO */

        function moveSlider(clientX){

            const rect = compare.getBoundingClientRect();

            let x = clientX - rect.left;

            /* LIMITI */

            if(x < 0) x = 0;

            if(x > rect.width) x = rect.width;

            const percent = (x / rect.width) * 100;

            /* TAGLIA FOTO */

            after.style.clipPath =
                `inset(0 ${100 - percent}% 0 0)`;

            /* MUOVE SLIDER */

            slider.style.left = percent + '%';
        }

        /* DESKTOP */

        slider.addEventListener('mousedown', () => {

            dragging = true;
        });

        window.addEventListener('mouseup', () => {

            dragging = false;
        });

        window.addEventListener('mousemove', e => {

            if(!dragging) return;

            moveSlider(e.clientX);
        });

        /* MOBILE */

        slider.addEventListener('touchstart', () => {

            dragging = true;
        });

        window.addEventListener('touchend', () => {

            dragging = false;
        });

        window.addEventListener('touchmove', e => {

            if(!dragging) return;

            moveSlider(e.touches[0].clientX);
        });

    });

</script>

</body>
</html>
