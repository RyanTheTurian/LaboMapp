<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Double Swipe</title>

    <style>

        /* RESET */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;

            user-select:none;
            -webkit-user-select:none;
        }

        /* PAGINA */

        html,body{

            width:100%;
        }

        body{

            background:transparent;

            font-family:Arial,sans-serif;
        }

        /* CONTENITORE */

        .container{

            display:grid;

            grid-template-columns:1fr 1fr;

            gap:16px;

            width:100%;

            max-width:1200px;

            margin:0 auto 24px auto;
        }

        /* COLONNA */

        .column{

            width:100%;
        }

        /* SWIPE */

        .compare{

            position:relative;

            width:100%;

            height:clamp(220px, 24vw, 320px);

            overflow:hidden;

            border-radius:15px;

            background:transparent;
        }

        /* IMMAGINI */

        .compare img{

            position:absolute;

            inset:0;

            width:100%;
            height:100%;

            object-fit:cover;

            pointer-events:none;

            -webkit-user-drag:none;
        }

        /* FOTO SOPRA */

        .after{

            z-index:2;

            clip-path:inset(0 50% 0 0);
        }

        /* SLIDER */

        .slider{

            position:absolute;

            top:0;
            left:50%;

            transform:translateX(-50%);

            width:4px;
            height:100%;

            background:white;

            z-index:10;

            cursor:ew-resize;

            touch-action:none;
        }

        /* CERCHIO */

        .slider::before{

            content:"↔";

            position:absolute;

            top:50%;
            left:50%;

            transform:translate(-50%,-50%);

            width:44px;
            height:44px;

            border-radius:50%;

            background:white;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:22px;
            font-weight:bold;

            color:black;

            box-shadow:0 0 10px rgba(0,0,0,0.25);
        }

        /* DIDASCALIA */

        .caption{

            margin-top:12px;

            text-align:center;

            font-size:15px;

            line-height:1.5;

            color:#222;

            max-width:90%;

            margin-left:auto;
            margin-right:auto;
        }

/* TABLET + MOBILE */

@media (max-width:900px){

    .container{

        grid-template-columns:1fr !important;
    }

    .compare{

        height:260px;
    }

    .caption{

        font-size:16px;
    }

    .slider::before{

        width:54px;
        height:54px;

        font-size:26px;
    }
}

        /* DESKTOP GRANDE */

        @media (min-width:1400px){

            .compare{

                height:600px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <!-- SLIDE 1 -->

    <div class="column">

        <div class="compare">

            <!-- FOTO SOTTO -->

            <img src="images/before1.jpg">

            <!-- FOTO SOPRA -->

            <img class="after"
                 src="images/after1.jpg">

            <!-- SLIDER -->

            <div class="slider"></div>

        </div>

        <!-- DIDASCALIA -->

        <div class="caption">

            Inserisci qui la didascalia dello slide 1.

        </div>

    </div>

    <!-- SLIDE 2 -->

    <div class="column">

        <div class="compare">

            <img src="images/before2.jpg">

            <img class="after"
                 src="images/after2.jpg">

            <div class="slider"></div>

        </div>

        <div class="caption">

            Inserisci qui la didascalia dello slide 2.

        </div>

    </div>

</div>

<script>

    /* SWIPE */

    document.querySelectorAll('.compare').forEach(compare => {

        const slider = compare.querySelector('.slider');

        const after = compare.querySelector('.after');

        let dragging = false;

        function moveSlider(clientX){

            const rect = compare.getBoundingClientRect();

            let x = clientX - rect.left;

            if(x < 0) x = 0;

            if(x > rect.width) x = rect.width;

            const percent = (x / rect.width) * 100;

            /* TAGLIO FOTO */

            after.style.clipPath =
                `inset(0 ${100 - percent}% 0 0)`;

            /* POSIZIONE SLIDER */

            slider.style.left = percent + '%';
        }

        /* DESKTOP */

        slider.addEventListener('mousedown', () => {

            dragging = true;
        });

        window.addEventListener('mouseup', () => {

            dragging = false;
        });

        window.addEventListener('mousemove', e => {

            if(!dragging) return;

            moveSlider(e.clientX);
        });

        /* MOBILE */

        slider.addEventListener('touchstart', () => {

            dragging = true;
        });

        window.addEventListener('touchend', () => {

            dragging = false;
        });

        window.addEventListener('touchmove', e => {

            if(!dragging) return;

            moveSlider(e.touches[0].clientX);
        });

    });

</script>

</body>
</html>
