<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Double Swipe</title>

    <style>

        /* RESET */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;

            user-select:none;
            -webkit-user-select:none;
        }

        /* PAGINA */

       body{

         font-family:Arial,sans-serif;

        background:#f8f8f8;

        padding:20px;
       }

        /* CONTENITORE */

        .container{

            display:flex;

            gap:10px;

            width:95%;
            height:80vh;
        }

        /* BLOCCO COMPARAZIONE */

        .compare{

            position:relative;

            width:50%;
            height:100%;

            overflow:hidden;

            border-radius:15px;

            background:white;
        }

        /* IMMAGINI */

        .compare img{

            position:absolute;

            top:0;
            left:0;

            width:100%;
            height:100%;

            object-fit:cover;

            pointer-events:none;
        }

        /* IMMAGINE SOPRA */

        .after{

            position:absolute;

            top:0;
            left:0;

            width:50%;
            height:100%;

            overflow:hidden;
        }

        /* SLIDER */

        .slider{

            position:absolute;

            top:0;
            left:50%;

            width:4px;
            height:100%;

            background:white;

            z-index:10;

            cursor:ew-resize;
        }

        /* CERCHIO */

        .slider::before{

            content:"↔";

            position:absolute;

            top:50%;
            left:50%;

            transform:translate(-50%,-50%);

            width:40px;
            height:40px;

            background:white;

            border-radius:50%;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:20px;
            font-weight:bold;

            color:black;
        }
        .container{

    display:flex;

    gap:10px;

    width:100%;

    height:80vh;

    margin-bottom:20px;
}
      @media (max-width: 768px){

    .container{
        flex-direction:column;
        height:auto;
    }

    .compare-wrapper{
        width:100%;
    }

    .compare{
        height:40vh;
    }

}

    </style>
</head>

<body>

<div class="container">

    <!-- COMPARAZIONE 1 -->

    <div class="compare">

        <!-- FOTO SOTTO -->

        <img src="images/before1.jpg">

        <!-- FOTO SOPRA -->

        <div class="after">
            <img src="images/after1.jpg">
        </div>

        <!-- SLIDER -->

        <div class="slider"></div>

    </div>

    <!-- COMPARAZIONE 2 -->

    <div class="compare">

        <img src="images/before2.jpg">

        <div class="after">
            <img src="images/after2.jpg">
        </div>

        <div class="slider"></div>

    </div>

</div>

<script>

    /* PER OGNI COMPARAZIONE */

    document.querySelectorAll('.compare').forEach(compare => {

        const slider = compare.querySelector('.slider');
        const after = compare.querySelector('.after');

        let dragging = false;

        /* CLICK */

        slider.addEventListener('mousedown', () => {
            dragging = true;
        });

        /* RILASCIO */

        window.addEventListener('mouseup', () => {
            dragging = false;
        });

        /* MOVIMENTO */

        window.addEventListener('mousemove', e => {

            if(!dragging) return;

            const rect = compare.getBoundingClientRect();

            let x = e.clientX - rect.left;

            /* LIMITI */

            if(x < 0) x = 0;
            if(x > rect.width) x = rect.width;

            /* MUOVE IMMAGINE */

            after.style.width = x + 'px';

            /* MUOVE SLIDER */

            slider.style.left = x + 'px';
        });

    });

</script>

</body>
</html>
