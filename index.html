<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Double Swipe</title>

    <style>

        /* RESET */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;

            user-select:none;
            -webkit-user-select:none;
        }

        /* PAGINA */

        html,body{
            width:100%;
        }

        body{

            background:transparent;

            font-family:Arial,sans-serif;
        }

        /* RIGA */

        .container{

            display:flex;

            gap:16px;

            width:100%;

            align-items:flex-start;

            margin-bottom:24px;
        }

        /* COLONNA */

        .column{

            flex:1;

            display:flex;

            flex-direction:column;

            min-width:0;
        }

        /* SWIPE */

        .compare{

            position:relative;

            flex:1 1 0;

            min-width:0;

            width:100%;

            height:min(32vw, 340px);

            overflow:hidden;

            border-radius:15px;

            background:#000;
        }

        /* IMMAGINI */

        .compare img{

            position:absolute;

            inset:0;

            width:100%;
            height:100%;

            object-fit:cover;

            pointer-events:none;

            -webkit-user-drag:none;
        }

        /* FOTO SOPRA */

        .after{

            z-index:2;

            clip-path:inset(0 50% 0 0);
        }

        /* SLIDER */

        .slider{

            position:absolute;

            top:0;
            left:50%;

            transform:translateX(-50%);

            width:4px;
            height:100%;

            background:white;

            z-index:10;

            cursor:ew-resize;

            touch-action:none;
        }

        /* CERCHIO */

        .slider::before{

            content:"↔";

            position:absolute;

            top:50%;
            left:50%;

            transform:translate(-50%,-50%);

            width:45px;
            height:45px;

            border-radius:50%;

            background:white;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:22px;
            font-weight:bold;

            color:black;

            box-shadow:0 0 10px rgba(0,0,0,0.25);
        }

        /* DIDASCALIA */

        .caption{

            margin-top:12px;

            font-size:15px;

            line-height:1.5;

            color:#222;
        }

        /* MOBILE */

        @media (max-width:768px){

            .container{

                flex-direction:column;

                gap:24px;
            }

            .compare{

                height:220px;
            }

            .slider::before{

                width:50px;
                height:50px;

                font-size:26px;
            }

            .caption{

                font-size:16px;
            }
        }

    </style>
</head>

<body>

<!-- RIGA 1 -->

<div class="container">

    <!-- COLONNA 1 -->

    <div class="column">

        <div class="compare">

            <img src="images/before1.jpg">

            <img class="after"
                 src="images/after1.jpg">

            <div class="slider"></div>

        </div>

        <div class="caption">

            Didascalia dello slide 1.
            Può occupare più righe senza
            rompere l’allineamento.

        </div>

    </div>

    <!-- COLONNA 2 -->

    <div class="column">

        <div class="compare">

            <img src="images/before2.jpg">

            <img class="after"
                 src="images/after2.jpg">

            <div class="slider"></div>

        </div>

        <div class="caption">

            Didascalia dello slide 2.

        </div>

    </div>

</div>

<!-- RIGA 2 -->

<div class="container">

    <!-- COLONNA 3 -->

    <div class="column">

        <div class="compare">

            <img src="images/before3.jpg">

            <img class="after"
                 src="images/after3.jpg">

            <div class="slider"></div>

        </div>

        <div class="caption">

            Didascalia dello slide 3.

        </div>

    </div>

    <!-- COLONNA 4 -->

    <div class="column">

        <div class="compare">

            <img src="images/before4.jpg">

            <img class="after"
                 src="images/after4.jpg">

            <div class="slider"></div>

        </div>

        <div class="caption">

            Didascalia dello slide 4.

        </div>

    </div>

</div>

<script>

    /* SWIPE */

    document.querySelectorAll('.compare').forEach(compare => {

        const slider = compare.querySelector('.slider');

        const after = compare.querySelector('.after');

        let dragging = false;

        function moveSlider(clientX){

            const rect = compare.getBoundingClientRect();

            let x = clientX - rect.left;

            if(x < 0) x = 0;

            if(x > rect.width) x = rect.width;

            const percent = (x / rect.width) * 100;

            after.style.clipPath =
                `inset(0 ${100 - percent}% 0 0)`;

            slider.style.left = percent + '%';
        }

        /* DESKTOP */

        slider.addEventListener('mousedown', () => {

            dragging = true;
        });

        window.addEventListener('mouseup', () => {

            dragging = false;
        });

        window.addEventListener('mousemove', e => {

            if(!dragging) return;

            moveSlider(e.clientX);
        });

        /* MOBILE */

        slider.addEventListener('touchstart', () => {

            dragging = true;
        });

        window.addEventListener('touchend', () => {

            dragging = false;
        });

        window.addEventListener('touchmove', e => {

            if(!dragging) return;

            moveSlider(e.touches[0].clientX);
        });

    });

    /* AUTO HEIGHT STORYMAPS */

    function updateHeight(){

        const h =
            document.body.scrollHeight;

        window.parent.postMessage({

            frameHeight:h

        }, "*");
    }

    window.addEventListener(
        "load",
        updateHeight
    );

    window.addEventListener(
        "resize",
        updateHeight
    );

    setTimeout(updateHeight,500);

</script>

</body>
</html>
